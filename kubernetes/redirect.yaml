apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-to-https
  namespace: hello-lab
spec:
  parentRefs:
    - name: hello-gateway
      sectionName: http
  hostnames:
    - "${LAB_HOST}"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hello-gateway
  namespace: hello-lab
spec:
  gatewayClassName: hello-traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 8000
      hostname: "${LAB_HOST}"
    - name: https
      protocol: HTTPS
      port: 8443
      hostname: "${LAB_HOST}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: hello-tls